<div class="login-wrap">
  <div class="login-card">
    @if (!svc.user()?.email) {
      <img class="login-logo" src="assets/king.png" alt="" />
      <h2 class="login-title">สำหรับแอดมิน</h2>
      <div class="login-sub">Kerori Raika — Control Panel</div>

      <button class="btn-oauth" (click)="svc.loginGoogle()">
        <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Sign in with Google
      </button>

      <div class="login-sep"><span>หรือ</span></div>

      <form class="login-form" (submit)="loginEmail($event, em, pw)">
        <input #em class="login-input" type="email" placeholder="อีเมล" required autocomplete="username" />
        <div class="pw-row">
          <input
            #pw
            class="login-input"
            [type]="showPw() ? 'text' : 'password'"
            placeholder="รหัสผ่าน"
            required
            autocomplete="current-password"
          />
          <button type="button" class="pw-eye" (click)="showPw.set(!showPw())" [title]="showPw() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'">
            @if (showPw()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" /><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" /><path d="m1 1 22 22" /><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" /></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
            }
          </button>
        </div>
        <button class="btn-primary" type="submit" [disabled]="busy()">
          {{ busy() ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ' }}
        </button>
      </form>

      @if (err()) {
        <div class="login-err">{{ err() }}</div>
      }
    } @else {
      <img class="login-logo" src="assets/king.png" alt="" />
      <h2 class="login-title">บัญชีนี้ไม่มีสิทธิ์แอดมิน</h2>
      <div class="login-email">{{ svc.user()?.email }}</div>
      <button class="btn-oauth" (click)="svc.logout()">ออกจากระบบ</button>
    }
  </div>
</div>
