<site-bg />
<site-nav />

@if (svc.isAdmin()) {
  <div class="admin-shell">
    <aside class="sidebar">
      <nav class="sb-nav">
        <a routerLink="/control" routerLinkActive="active">
          <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" />
          </svg>
          Control Panel
        </a>
        <a routerLink="/master" routerLinkActive="active">
          <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
            <ellipse cx="12" cy="5" rx="9" ry="3" />
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3" />
          </svg>
          Master Data
        </a>
        <button class="sb-group" type="button" (click)="uiOpen.set(!uiOpen())">
          <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z" />
          </svg>
          ตั้งค่า UI
          <svg viewBox="0 0 24 24" class="sb-caret" [class.open]="uiOpen()" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
        @if (uiOpen()) {
          <div class="sb-sub">
            <a routerLink="/settings" routerLinkActive="active">
              <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <path d="M9 22V12h6v10" />
              </svg>
              ตั้งค่าเว็บ (หน้า home)
            </a>
            <a routerLink="/register-settings" routerLinkActive="active">
              <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M19 8v6M22 11h-6" />
              </svg>
              ตั้งค่าหน้า register
            </a>
            <a routerLink="/nav-settings" routerLinkActive="active">
              <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="4" width="18" height="4" rx="1" />
                <path d="M3 12h18M3 17h12" />
              </svg>
              ตั้งค่า site-nav
            </a>
            <a routerLink="/gallery-settings" routerLinkActive="active">
              <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M12 8v8M8 12h8" />
              </svg>
              ตั้งค่าหน้ารูปแจก
            </a>
          </div>
        }
        <a routerLink="/images" routerLinkActive="active">
          <svg viewBox="0 0 24 24" class="sb-icon" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <path d="M21 15l-5-5L5 21" />
          </svg>
          จัดการรูป
        </a>
      </nav>

      <div class="sb-bottom">
        <div class="sb-user" [title]="svc.user()?.email">{{ svc.user()?.email }}</div>
      </div>
    </aside>

    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
} @else {
  <admin-login />
}
